name: Build Fusion OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'build.sh'
      - 'auto/**'
      - 'config/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out Fusion OS build kit
        uses: actions/checkout@v4

      - name: Install Debian live-build tools
        env:
          DEBIAN_FRONTEND: noninteractive
       run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends live-build debootstrap xorriso squashfs-tools

      - name: Build Fusion OS live ISO
        run: |
          # 1. Strip Windows CRLF line endings safely
          find . -type f \( -name "*.sh" -o -path "./auto/*" -o -path "./config/*" \) -exec sed -i 's/\r$//' {} +

          # 2. Safely make scripts executable (ignores missing/empty directories)
          find . -type f -name "*.sh" -exec chmod +x {} +
          [ -d "auto" ] && find auto -type f -exec chmod +x {} +
          [ -d "config/hooks/live" ] && find config/hooks/live -type f -exec chmod +x {} +

          # 3. Proceed with your live-build commands
          # lb config \
               --linux-packages "linux-image" \
               --linux-flavours "amd64"
             ...
          # lb build ...

      - name: Verify ISO output
        run: |
          shopt -s nullglob
          isos=( *.iso )
          if (( ${#isos[@]} == 0 )); then
            echo "Build completed without producing an ISO."
            exit 1
          fi
          ls -lh "${isos[@]}"
          sha256sum "${isos[@]}" | tee SHA256SUMS

      - name: Upload ISO build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fusion-os-live-iso
          path: |
            *.iso
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
